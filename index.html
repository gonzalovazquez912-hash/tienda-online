<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Online</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__content">
        <h1>Tienda Online</h1>
        <p>Compra fácil, rápido y seguro.</p>
      </div>
    </header>

    <main class="container layout">
      <section class="catalog">
        <div class="catalog__toolbar">
          <input id="searchInput" type="search" placeholder="Buscar producto..." />
          <select id="categoryFilter">
            <option value="all">Todas las categorías</option>
          </select>
        </div>
        <div id="productGrid" class="product-grid"></div>
      </section>

      <aside class="cart">
        <h2>Carrito</h2>
        <ul id="cartItems" class="cart__items"></ul>
        <div class="cart__summary">
          <p>Subtotal: <strong id="subtotalAmount">$0.00</strong></p>
          <p>Envío: <strong id="shippingAmount">$0.00</strong></p>
          <p>Total: <strong id="totalAmount">$0.00</strong></p>
        </div>

        <form id="checkoutForm" class="checkout-form">
          <h3>Finalizar compra</h3>
          <label>
            Nombre completo
            <input id="fullName" name="fullName" type="text" required />
          </label>
          <label>
            Email
            <input id="email" name="email" type="email" required />
          </label>
          <label>
            Dirección
            <textarea id="address" name="address" rows="3" required></textarea>
          </label>
          <button id="checkoutBtn" type="submit">Confirmar pedido</button>
        </form>
        <p id="checkoutMessage" class="checkout-message" aria-live="polite"></p>
      </aside>
    </main>

    <template id="productCardTemplate">
      <article class="product-card">
        <img class="product-card__image" alt="" />
        <div class="product-card__body">
          <h3 class="product-card__title"></h3>
          <p class="product-card__category"></p>
          <p class="product-card__price"></p>
          <button class="product-card__button" type="button">Agregar al carrito</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
